<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ExpenseGuard - Sign In</title>

    <link rel="stylesheet" href="../css/auth.css" />

    <link rel="stylesheet" href="../css/evaluation.css" />
  </head>

  <body>
    <div class="auth-container">
      <!-- LEFT SIDE -->

      <div class="auth-brand">
        <div class="auth-logo">Expense<span>Guard</span></div>

        <h1>
          Welcome<br />
          back.
        </h1>

        <p>
          Continue managing your expenses and monitoring unusual spending
          patterns.
        </p>

        <div class="brand-feature">
          <span>✓</span>
          Track every transaction
        </div>

        <div class="brand-feature">
          <span>✓</span>
          Detect unusual spending
        </div>

        <div class="brand-feature">
          <span>✓</span>
          Understand your spending habits
        </div>
      </div>

      <!-- RIGHT SIDE -->

      <div class="auth-card-container">
        <div class="auth-card">
          <div class="auth-header">
            <div class="mobile-logo">Expense<span>Guard</span></div>

            <h2>Sign In</h2>

            <p>Login to your ExpenseGuard account.</p>
          </div>

          <form id="signinForm">
            <div class="auth-form-group">
              <label> Email Address </label>

              <input
                type="email"
                id="signinEmail"
                placeholder="Enter your email"
                required
              />
            </div>

            <div class="auth-form-group">
              <label> Password </label>

              <input
                type="password"
                id="signinPassword"
                placeholder="Enter your password"
                required
              />
            </div>

            <button type="submit" class="auth-btn">Sign In</button>

            <div id="signinMessage" class="auth-message"></div>
          </form>

          <div class="auth-switch">
            Don't have an account?

            <a href="signup.html"> Create Account </a>
          </div>
        </div>
      </div>
    </div>

    <script src="../javascript/app.js"></script>
  </body>
</html>
