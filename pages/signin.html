<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ExpenseGuard - Sign In</title>

    <link rel="stylesheet" href="../css/auth.css" />

    <link rel="stylesheet" href="../css/evaluation.css" />
  </head>

  <body>
    <div class="auth-container">
      <!-- LEFT SIDE -->

      <div class="auth-brand">
        <div class="auth-logo">Expense<span>Guard</span></div>

        <h1>
          Welcome<br />
          back.
        </h1>

        <p>
          Continue managing your expenses and monitoring unusual spending
          patterns.
        </p>

        <div class="brand-feature">
          <span>✓</span>
          Track every transaction
        </div>

        <div class="brand-feature">
          <span>✓</span>
          Detect unusual spending
        </div>

        <div class="brand-feature">
          <span>✓</span>
          Understand your spending habits
        </div>
      </div>

      <!-- RIGHT SIDE -->

      <div class="auth-card-container">
        <div class="auth-card">
          <div class="auth-header">
            <div class="mobile-logo">Expense<span>Guard</span></div>

            <h2>Sign In</h2>

            <p>Login to your ExpenseGuard account.</p>
          </div>

          <form id="signinForm">
            <div class="auth-form-group">
              <label> Email Address </label>

              <input
                type="email"
                id="signinEmail"
                placeholder="Enter your email"
                required
              />
            </div>

            <div class="auth-form-group">
              <label for="signinPassword"> Password </label>
              <div class="password-input-wrapper">
                <input
                  type="password"
                  id="signinPassword"
                  placeholder="Enter your password"
                  required
                />
                <button
                  type="button"
                  class="password-toggle-btn"
                  data-target="signinPassword"
                  aria-label="Toggle password visibility"
                  tabindex="-1"
                >
                  <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  <svg class="eye-off-icon" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                    <line x1="2" y1="2" x2="22" y2="22"/>
                  </svg>
                </button>
              </div>
            </div>

            <button type="submit" class="auth-btn">Sign In</button>

            <div id="signinMessage" class="auth-message"></div>
          </form>

          <div class="auth-switch">
            Don't have an account?

            <a href="signup.html"> Create Account </a>
          </div>

          <div class="auth-admin-footer">
            <a href="admin-login.html" class="auth-admin-link">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <span>Admin Login</span>
            </a>
          </div>
        </div>
      </div>
    </div>

    <script src="../javascript/app.js"></script>
  </body>
</html>
